version: '3.8'

services:
  cassandra:
    image: cassandra:latest
    container_name: cassandra-node
    ports:
      - "9042:9042"  # CQL порт
      - "7000:7000"  # Межнодовое взаимодействие (gossip)
    environment:
      - CASSANDRA_CLUSTER_NAME=BlockchainCluster
      - CASSANDRA_NUM_TOKENS=256
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_SEEDS=${CASSANDRA_SEEDS:-cassandra-node}
      - CASSANDRA_BROADCAST_ADDRESS=${CASSANDRA_BROADCAST_ADDRESS:-}          
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./cassandra/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 5

  ipfs:
    image: ipfs/kubo:latest
    container_name: ipfs-node
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ./ipfs/ipfs_data:/data/ipfs
      - ./ipfs/staging:/export
      - ./ipfs/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/entrypoint.sh"]

  ipfs-cluster:
    image: ipfs/ipfs-cluster:latest
    container_name: ipfs-cluster
    ports:
      - "9094:9094"   # Cluster API (HTTP)
      - "9095:9095"   # Cluster API (libp2p)
      - "9096:9096"   # Cluster REST API
    environment:
      - CLUSTER_IPFSHTTP_NODEMULTIADDRESS=/dns4/ipfs-node/tcp/5001
      - CLUSTER_RENDEZVOUS=blockchain-cluster
      - CLUSTER_SECRET=${CLUSTER_SECRET:-}
      - CLUSTER_REPLICATION_FACTOR_MIN=1
      - CLUSTER_REPLICATION_FACTOR_MAX=1
      - CLUSTER_ALLOCATION_STRATEGY=descend_free_space
      - CLUSTER_MONITOR_PINGINTERVAL=5s
      - CLUSTER_CRDT_TRUSTEDPEERS=*
      # REST API — на всех интерфейсах, порт 9096
      - CLUSTER_RESTAPI_HTTPLISTENMULTIADDRESS=/ip4/0.0.0.0/tcp/9094
      - CLUSTER_LISTENMULTIADDRESS=/ip4/0.0.0.0/tcp/9096
    volumes:
      - ipfs_cluster_data:/data/ipfs-cluster
    depends_on:
      ipfs:
        condition: service_healthy
    restart: always

  nodemanager:
    build: ./nodeManager
    container_name: nodemanager
    ports:
      - "${NODE_PORT:-8000}:8000"
    env_file:
      - ./nodeManager/.env
    environment:
      - NODE_ID=${NODE_ID:-}
      - NODE_HOST=${NODE_HOST:-localhost}
      - NODE_PORT=${NODE_PORT:-8000}
      - SEED_PEERS=${SEED_PEERS:-}
    volumes:
      - ./nodeManager:/app
      - state_data:/data
    depends_on:
      cassandra:
        condition: service_healthy
      ipfs:
        condition: service_healthy

volumes:
  cassandra_data:
  ipfs_data:
  ipfs_cluster_data:
  state_data:
